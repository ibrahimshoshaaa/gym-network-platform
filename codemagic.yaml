# Manual builds only: preserve the free Codemagic allowance.
workflows:
  gymbank-check:
    name: GymBank - checks only
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      flutter: 3.47.7
      java: 17
    scripts:
      - name: Prepare Flutter Android host
        script: |
          set -euo pipefail
          cd apps/mobile
          backup_dir=$(mktemp -d)
          trap 'rm -rf "$backup_dir"' EXIT
          cp pubspec.yaml pubspec.lock "$backup_dir/"
          cp -R lib "$backup_dir/lib"
          flutter create --platforms=android --org net.shotech --project-name gym_network .
          cp "$backup_dir/pubspec.yaml" "$backup_dir/pubspec.lock" .
          cp -R "$backup_dir/lib/." lib/
          rm -f test/widget_test.dart
          python3 tool/prepare_platforms.py
          python3 tool/configure_signing.py
          flutter pub get
      - name: Analyze and test
        script: |
          set -euo pipefail
          cd apps/mobile
          python3 -m unittest discover -s tool -p 'test_signing.py'
          flutter analyze lib test --no-fatal-infos
          flutter test

  gymbank-android:
    name: GymBank - signed Android APK
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      flutter: 3.47.7
      java: 17
      groups:
        - gymbank_android_signing
    scripts:
      - name: Prepare Flutter Android host
        script: |
          set -euo pipefail
          cd apps/mobile
          backup_dir=$(mktemp -d)
          trap 'rm -rf "$backup_dir"' EXIT
          cp pubspec.yaml pubspec.lock "$backup_dir/"
          cp -R lib "$backup_dir/lib"
          flutter create --platforms=android --org net.shotech --project-name gym_network .
          cp "$backup_dir/pubspec.yaml" "$backup_dir/pubspec.lock" .
          cp -R "$backup_dir/lib/." lib/
          rm -f test/widget_test.dart
          python3 tool/prepare_platforms.py
          python3 tool/configure_signing.py
          flutter pub get
      - name: Analyze and test
        script: |
          set -euo pipefail
          cd apps/mobile
          python3 -m unittest discover -s tool -p 'test_signing.py'
          flutter analyze lib test --no-fatal-infos
          flutter test
      - name: Build and verify permanent signed APKs
        script: |
          set -euo pipefail
          cd apps/mobile
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export GYMBANK_KEYSTORE_PATH="$CM_BUILD_DIR/.gymbank-signing/release.jks"
          trap 'rm -rf "$CM_BUILD_DIR/.gymbank-signing"' EXIT
          python3 tool/install_signing.py
          # Separate, increasing range above the existing GitHub build numbers.
          build_number=$((200000 + BUILD_NUMBER))
          flutter build apk --release --split-per-abi --build-name 0.2.7 --build-number "$build_number"
          python3 tool/verify_apks.py "$build_number"
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          root = Path('build/app/outputs/flutter-apk')
          (root / 'SHA256SUMS.txt').write_text(''.join(
              hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n'
              for p in sorted(root.glob('*.apk'))
          ))
          PY
    artifacts:
      - apps/mobile/build/app/outputs/flutter-apk/*.apk
      - apps/mobile/build/app/outputs/flutter-apk/SHA256SUMS.txt

  gymbank-android-preview:
    name: GymBank - services preview APK
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      flutter: 3.47.7
      java: 17
      groups:
        - gymbank_android_signing
    scripts:
      - name: Verify isolated services preview
        script: |
          set -euo pipefail
          test "$CM_BRANCH" = "codex/branch-services-bookings" || { echo "Select codex/branch-services-bookings for this preview."; exit 1; }
          python3 - <<'PY'
          import json
          import urllib.request
          url = 'https://gym-network-platform-git-codex-branch-services-bookings-shosha4.vercel.app/api/health'
          with urllib.request.urlopen(url, timeout=30) as response:
              if response.status != 200 or 'json' not in response.headers.get('Content-Type', ''):
                  raise SystemExit('Preview API is not publicly reachable. Check deployment protection.')
              json.load(response)
          print('Preview API reachable.')
          PY
      - name: Prepare Flutter Android host
        script: |
          set -euo pipefail
          cd apps/mobile
          backup_dir=$(mktemp -d)
          trap 'rm -rf "$backup_dir"' EXIT
          cp pubspec.yaml pubspec.lock "$backup_dir/"
          cp -R lib "$backup_dir/lib"
          flutter create --platforms=android --org net.shotech --project-name gym_network .
          cp "$backup_dir/pubspec.yaml" "$backup_dir/pubspec.lock" .
          cp -R "$backup_dir/lib/." lib/
          rm -f test/widget_test.dart
          python3 tool/prepare_platforms.py
          python3 tool/configure_signing.py
          flutter pub get
      - name: Analyze and test
        script: |
          set -euo pipefail
          cd apps/mobile
          python3 -m unittest discover -s tool -p 'test_signing.py'
          flutter analyze lib test --no-fatal-infos
          flutter test
      - name: Build and verify permanent signed APKs
        script: |
          set -euo pipefail
          cd apps/mobile
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export GYMBANK_KEYSTORE_PATH="$CM_BUILD_DIR/.gymbank-signing/release.jks"
          trap 'rm -rf "$CM_BUILD_DIR/.gymbank-signing"' EXIT
          python3 tool/install_signing.py
          # Separate, increasing range above the existing GitHub build numbers.
          build_number=$((200000 + BUILD_NUMBER))
          flutter build apk --release --split-per-abi --build-name 0.2.7-preview --build-number "$build_number" --dart-define=GYM_API_ORIGIN=https://gym-network-platform-git-codex-branch-services-bookings-shosha4.vercel.app
          python3 tool/verify_apks.py "$build_number"
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          root = Path('build/app/outputs/flutter-apk')
          (root / 'SHA256SUMS.txt').write_text(''.join(
              hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n'
              for p in sorted(root.glob('*.apk'))
          ))
          PY
    artifacts:
      - apps/mobile/build/app/outputs/flutter-apk/*.apk
      - apps/mobile/build/app/outputs/flutter-apk/SHA256SUMS.txt

  gymbank-api:
    name: GymBank - API and ledger checks
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      node: 22
      vars:
        DATABASE_URL: "postgresql://ci:ci@127.0.0.1:55432/gym_ci?schema=public"
    scripts:
      - name: Install dependencies and validate API
        script: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --filter @gym/api db:generate
          pnpm --filter @gym/api db:validate
          pnpm --filter @gym/api typecheck
          pnpm --filter @gym/api build
          pnpm --filter @gym/api test
          pnpm --filter @gym/api test:runtime
      - name: Test migrations and ledger on disposable PostgreSQL
        script: |
          set -euo pipefail
          brew list postgresql@16 >/dev/null 2>&1 || brew install postgresql@16
          export PATH="$(brew --prefix postgresql@16)/bin:$PATH"
          ci_database_dir=$(mktemp -d)
          trap 'pg_ctl -D "$ci_database_dir" -m immediate stop >/dev/null 2>&1 || true; rm -rf "$ci_database_dir"' EXIT
          initdb -D "$ci_database_dir" -U ci --auth=trust
          pg_ctl -D "$ci_database_dir" -l "$ci_database_dir/server.log" -o "-h 127.0.0.1 -p 55432" -w start
          createdb -h 127.0.0.1 -p 55432 -U ci gym_ci
          pnpm --filter @gym/api db:deploy
          psql -h 127.0.0.1 -p 55432 -U ci -d gym_ci -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE gym_app LOGIN PASSWORD 'gym_app' NOSUPERUSER NOCREATEDB NOCREATEROLE;
          GRANT CONNECT ON DATABASE gym_ci TO gym_app;
          GRANT USAGE ON SCHEMA public TO gym_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO gym_app;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO gym_app;
          SQL
          DATABASE_URL='postgresql://gym_app:gym_app@127.0.0.1:55432/gym_ci?schema=public' pnpm --filter @gym/api test:db
      - name: Validate dashboard types and gateway tests
        script: |
          set -euo pipefail
          pnpm --filter @gym/web typecheck
          pnpm --filter @gym/web test
