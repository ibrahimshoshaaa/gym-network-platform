  gymbank-phone-otp-preview:
    name: GymBank - phone OTP preview APK
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      flutter: 3.47.7
      java: 17
      vars:
        GYMBANK_PHONE_PREVIEW_ORIGIN: "https://gym-network-platform-git-codex-phone-otp-preview-shosha4.vercel.app"
      groups:
        - gymbank_android_signing
    scripts:
      - name: Verify isolated phone OTP preview
        script: |
          set -euo pipefail
          test "$CM_BRANCH" = "codex/phone-otp-preview"
          python3 - <<'PY'
          import json, os, urllib.request
          from urllib.parse import urlparse
          origin = os.environ.get('GYMBANK_PHONE_PREVIEW_ORIGIN', '').rstrip('/')
          parsed = urlparse(origin)
          if parsed.scheme != 'https' or not parsed.hostname or parsed.path or parsed.query or parsed.fragment or parsed.username or parsed.password:
              raise SystemExit('Set GYMBANK_PHONE_PREVIEW_ORIGIN to the approved isolated HTTPS preview origin.')
          if parsed.hostname == 'gym-network-platform.vercel.app':
              raise SystemExit('Production origin is not allowed for the fixed-code preview.')
          with urllib.request.urlopen(origin + '/api/mobile/auth/phone/status', timeout=30) as response:
              status = json.load(response)
          if not status.get('enabled') or not status.get('testMode'):
              raise SystemExit('Phone OTP test mode is not enabled on this preview.')
          print('Phone OTP preview reachable and explicitly enabled.')
          PY
      - name: Prepare Flutter Android host
        script: |
          set -euo pipefail
          cd apps/mobile
          backup_dir=$(mktemp -d)
          trap 'rm -rf "$backup_dir"' EXIT
          cp pubspec.yaml pubspec.lock "$backup_dir/"
          cp -R lib "$backup_dir/lib"
          flutter create --platforms=android --org net.shotech --project-name gym_network .
          cp "$backup_dir/pubspec.yaml" "$backup_dir/pubspec.lock" .
