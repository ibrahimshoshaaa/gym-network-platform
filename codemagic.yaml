          flutter analyze lib test --no-fatal-infos
          flutter test
      - name: Build and verify permanent signed APKs
        script: |
          set -euo pipefail
          cd apps/mobile
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export GYMBANK_KEYSTORE_PATH="$CM_BUILD_DIR/.gymbank-signing/release.jks"
          trap 'rm -rf "$CM_BUILD_DIR/.gymbank-signing"' EXIT
