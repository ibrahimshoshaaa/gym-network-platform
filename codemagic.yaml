          flutter build apk --release --split-per-abi --build-name 0.2.7 --build-number "$build_number" --dart-define=GYM_PHONE_OTP_PREVIEW=true --dart-define=GYM_API_ORIGIN="$GYMBANK_PHONE_PREVIEW_ORIGIN"
          python3 tool/verify_apks.py "$build_number"
          python3 - <<'PY'
          import hashlib
