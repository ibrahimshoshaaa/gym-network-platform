name: gym_network
publish_to: none
description: Native GymBank experience for trainees, gym owners and branch staff.
version: 0.2.7+9
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  http: ^1.5.0
  flutter_secure_storage: ^9.2.4
  image_picker: ^1.2.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  url_launcher: ^6.3.2
dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/brand/google-g.png
    - assets/brand/gymbank-wordmark.png
    - assets/brand/gymbank-icon.png

