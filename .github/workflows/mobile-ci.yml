name: Build Android mobile client
on:
  pull_request:
    branches: [main, develop]
    paths: ['apps/mobile/**', '.github/workflows/mobile-ci.yml']
  push:
    branches: [main]
    paths: ['apps/mobile/**', '.github/workflows/mobile-ci.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Generate Android host from tested Flutter template
        working-directory: apps/mobile
        run: |
          cp pubspec.yaml /tmp/gym-pubspec.yaml
          cp -r lib /tmp/gym-mobile-lib
          flutter create --platforms=android --org net.shotech --project-name gym_network .
          cp /tmp/gym-pubspec.yaml pubspec.yaml
          cp -r /tmp/gym-mobile-lib/. lib/
          rm -f test/widget_test.dart
          python3 tool/prepare_platforms.py
          flutter pub get
      - name: Analyze and test mobile navigation
        working-directory: apps/mobile
        run: |
          flutter analyze lib test --no-fatal-infos
          flutter test
      - name: Build optimized Android APKs
        working-directory: apps/mobile
        run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: gym-network-android-apks
          path: apps/mobile/build/app/outputs/flutter-apk/*.apk
          retention-days: 30
