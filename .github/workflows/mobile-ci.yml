name: Build Android mobile client
on:
  pull_request:
    branches: [main, develop]
    paths: ['apps/mobile/**', '.github/workflows/mobile-ci.yml']
  push:
    branches: [main]
    paths: ['apps/mobile/**', '.github/workflows/mobile-ci.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Generate Android host from tested Flutter template
        working-directory: apps/mobile
        run: |
          cp pubspec.yaml /tmp/gym-pubspec.yaml
          cp -r lib /tmp/gym-mobile-lib
          flutter create --platforms=android --org net.shotech --project-name gym_network .
          cp /tmp/gym-pubspec.yaml pubspec.yaml
          cp -r /tmp/gym-mobile-lib/. lib/
          rm -f test/widget_test.dart
          python3 tool/prepare_platforms.py
          flutter pub get
      - name: Analyze and test mobile navigation
        working-directory: apps/mobile
        run: |
          flutter analyze lib test --no-fatal-infos
          flutter test
      - name: Build optimized Android APKs
        working-directory: apps/mobile
        run: flutter build apk --release --split-per-abi
      - name: Attach installable APKs to private release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view mobile-v0.2.0 >/dev/null 2>&1 || gh release create mobile-v0.2.0 --target "$GITHUB_SHA" --title "Gym Network Android 0.2.0" --notes "Native trainee and gym owner application. OTP, wallet PIN and background push remain deferred. Testing build; store signing is separate."
          gh release upload mobile-v0.2.0 apps/mobile/build/app/outputs/flutter-apk/*.apk --clobber
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: gym-network-android-apks
          path: apps/mobile/build/app/outputs/flutter-apk/*.apk
          retention-days: 30

