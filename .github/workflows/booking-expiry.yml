name: Process overdue gym bookings
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/booking-expiry.yml']
permissions: {}
concurrency:
  group: booking-expiry-production
  cancel-in-progress: false
jobs:
  process:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      id-token: write
    steps:
      - name: Process expired grace periods with short-lived workflow identity
        shell: python
        run: |
          import json, os, time, urllib.parse, urllib.request, urllib.error
          endpoint = 'https://gym-network-platform.vercel.app/api/internal/bookings/process-due'
          def request_json(url, headers, method='GET'):
              request = urllib.request.Request(url, headers=headers, method=method)
              # This endpoint and GitHub's issuer must never redirect credentials.
              class NoRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self, *args, **kwargs):
                      return None
              with urllib.request.build_opener(NoRedirect()).open(request, timeout=70) as response:
                  return json.load(response)
          failures = 0
          for batch in range(10):
              try:
                  oidc_url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&audience=' + urllib.parse.quote(endpoint, safe='')
                  identity = request_json(oidc_url, {'Authorization':'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})['value']
                  result = request_json(endpoint, {'Authorization':'Bearer ' + identity}, 'POST')
                  print(json.dumps({'processed':result['processed'], 'failed':result['failed'], 'hasMore':result['hasMore']}))
                  if not result['hasMore']:
                      break
              except (urllib.error.URLError, TimeoutError) as error:
                  failures += 1
                  print('Booking worker invocation failed; retrying. HTTP status: ' + str(getattr(error, 'code', 'unavailable')))
                  if failures >= 5:
                      raise SystemExit('Booking processor unavailable; inspect the production deployment and retry this workflow.')
                  time.sleep(25)
          else:
              raise SystemExit('Booking processor reached batch limit; backlog remains for the next scheduled invocation.')
