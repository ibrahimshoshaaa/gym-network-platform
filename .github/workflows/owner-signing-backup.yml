name: Encrypted owner signing backup
on:
  push:
    branches: [backup/android-signing-owner-20261026]
    paths: ['.github/workflows/owner-signing-backup.yml']
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate original key and encrypt owner backup
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export GYMBANK_KEYSTORE_PATH="$RUNNER_TEMP/owner-signing/gymbank-release.jks"
          trap 'rm -rf "$RUNNER_TEMP/owner-signing"' EXIT
          python3 apps/mobile/tool/install_signing.py
          python3 - <<'PY'
          import os,json,pathlib
          folder=pathlib.Path(os.environ['GYMBANK_KEYSTORE_PATH']).parent
          data={'storeFile':'gymbank-release.jks','storePassword':os.environ['ANDROID_KEYSTORE_PASSWORD'],'keyPassword':os.environ['ANDROID_KEY_PASSWORD'],'keyAlias':os.environ['ANDROID_KEY_ALIAS'],'certificateSha256':os.environ['ANDROID_SIGNING_CERT_SHA256']}
          (folder/'signing-credentials.json').write_text(json.dumps(data,indent=2))
          (folder/'README.txt').write_text('GymBank original Android release signing backup. Keep the JKS and credentials private and together. Do not commit or publish them. This backup preserves the current app signing identity.\n')
          PY
          tar -C "$RUNNER_TEMP/owner-signing" -czf - gymbank-release.jks signing-credentials.json README.txt | openssl cms -encrypt -binary -aes-256-cbc -outform DER -out "$RUNNER_TEMP/gymbank-owner-backup.p7m" .github/owner-backup-recipient.crt
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-owner-signing-backup
          path: ${{ runner.temp }}/gymbank-owner-backup.p7m
          retention-days: 1
