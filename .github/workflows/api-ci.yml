name: Validate API scaffold

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/gym_ci?schema=public
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable package manager
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @gym/api db:generate
      - name: Validate Prisma schema
        run: pnpm --filter @gym/api db:validate
      - name: Typecheck API
        run: pnpm --filter @gym/api typecheck
      - name: Build API
        run: pnpm --filter @gym/api build
      - name: Smoke-test health route
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { buildApp } from './apps/api/dist/app.js';
          const app = buildApp();
          const response = await app.inject({ method: 'GET', url: '/health' });
          assert.equal(response.statusCode, 200);
          assert.equal(response.json().status, 'ok');
          await app.close();
          NODE
