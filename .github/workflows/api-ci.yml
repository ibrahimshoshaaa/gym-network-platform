name: Validate API and ledger

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: gym_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d gym_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/gym_ci?schema=public
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Enable package manager
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @gym/api db:generate
      - name: Validate Prisma schema
        run: pnpm --filter @gym/api db:validate
      - name: Typecheck API
        run: pnpm --filter @gym/api typecheck
      - name: Build API
        run: pnpm --filter @gym/api build
      - name: Test health and disabled routes
        run: pnpm --filter @gym/api test
      - name: Test injection with require(ESM) disabled like serverless runtimes
        run: pnpm --filter @gym/api test:runtime
      - name: Apply migrations to disposable PostgreSQL
        run: pnpm --filter @gym/api db:deploy
      - name: Create restricted runtime role
        env:
          PGPASSWORD: ci
        run: |
          psql -h localhost -U ci -d gym_ci -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE gym_app LOGIN PASSWORD 'gym_app' NOSUPERUSER NOCREATEDB NOCREATEROLE;
          GRANT CONNECT ON DATABASE gym_ci TO gym_app;
          GRANT USAGE ON SCHEMA public TO gym_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO gym_app;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO gym_app;
          SQL
      - name: Test ledger, concurrency, permissions and sessions on PostgreSQL
        env:
          DATABASE_URL: postgresql://gym_app:gym_app@localhost:5432/gym_ci?schema=public
        run: pnpm --filter @gym/api test:db

      - name: Typecheck dashboard
        run: pnpm --filter @gym/web typecheck
      - name: Test dashboard gateway security and money conversion
        run: pnpm --filter @gym/web test
      - name: Build dashboard
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: pnpm --filter @gym/web build
      - name: Install headless browser for mobile viewport verification
        run: pnpm --filter @gym/web exec playwright install --with-deps chromium
      - name: Test dashboard HTTP flow through API and PostgreSQL
        env:
          NODE_OPTIONS: --no-experimental-require-module
          GYM_BROWSER_TEST: "1"
          DATABASE_URL: postgresql://gym_app:gym_app@localhost:5432/gym_ci?schema=public
        run: pnpm --filter @gym/web test:live

      - name: Retain platform-admin browser screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: platform-admin-browser-checks
          path: apps/web/build-verification/*.png
          if-no-files-found: ignore
          retention-days: 7
